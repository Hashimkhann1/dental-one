<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Dental Care">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="dental_one">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Dental Care</title>
  <link rel="manifest" href="manifest.json">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      overflow: hidden;
    }

    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.5s ease-out;
    }

    #loading-screen.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    .loader-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
    }

    .tooth-icon {
      width: 80px;
      height: 80px;
      background: #0883c4;
      border-radius: 50% 50% 40% 40%;
      position: relative;
      animation: float 2s ease-in-out infinite;
      box-shadow: 0 10px 40px rgba(8, 131, 196, 0.3);
    }

    .tooth-icon::before {
      content: '';
      position: absolute;
      width: 30px;
      height: 35px;
      background: #0883c4;
      bottom: -15px;
      left: 10px;
      border-radius: 0 0 50% 50%;
    }

    .tooth-icon::after {
      content: '';
      position: absolute;
      width: 30px;
      height: 35px;
      background: #0883c4;
      bottom: -15px;
      right: 10px;
      border-radius: 0 0 50% 50%;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0px) rotate(0deg);
      }
      50% {
        transform: translateY(-20px) rotate(5deg);
      }
    }

    .sparkle {
      position: absolute;
      width: 20px;
      height: 20px;
      animation: sparkle 1.5s ease-in-out infinite;
    }

    .sparkle::before,
    .sparkle::after {
      content: '';
      position: absolute;
      background: #0883c4;
      border-radius: 2px;
    }

    .sparkle::before {
      width: 3px;
      height: 15px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .sparkle::after {
      width: 15px;
      height: 3px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .sparkle-1 {
      top: 10%;
      left: 30%;
      animation-delay: 0s;
    }

    .sparkle-2 {
      top: 20%;
      right: 25%;
      animation-delay: 0.5s;
    }

    .sparkle-3 {
      bottom: 25%;
      left: 20%;
      animation-delay: 1s;
    }

    @keyframes sparkle {
      0%, 100% {
        opacity: 0;
        transform: scale(0) rotate(0deg);
      }
      50% {
        opacity: 1;
        transform: scale(1) rotate(180deg);
      }
    }

    .loading-text {
      color: #0883c4;
      font-size: 24px;
      font-weight: 600;
      letter-spacing: 1px;
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 0.6;
      }
      50% {
        opacity: 1;
      }
    }

    .progress-bar {
      width: 200px;
      height: 4px;
      background: rgba(8, 131, 196, 0.2);
      border-radius: 2px;
      overflow: hidden;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      background: #0883c4;
      border-radius: 2px;
      animation: progress 2s ease-in-out infinite;
      box-shadow: 0 0 10px rgba(8, 131, 196, 0.5);
    }

    @keyframes progress {
      0% {
        width: 0%;
        transform: translateX(0);
      }
      50% {
        width: 70%;
      }
      100% {
        width: 100%;
        transform: translateX(0);
      }
    }

    .dots {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .dot {
      width: 8px;
      height: 8px;
      background: #0883c4;
      border-radius: 50%;
      animation: dotBounce 1.4s infinite ease-in-out both;
    }

    .dot:nth-child(1) {
      animation-delay: -0.32s;
    }

    .dot:nth-child(2) {
      animation-delay: -0.16s;
    }

    @keyframes dotBounce {
      0%, 80%, 100% {
        transform: scale(0);
        opacity: 0.5;
      }
      40% {
        transform: scale(1);
        opacity: 1;
      }
    }
  </style>
</head>
<body>
<!-- Loading Screen -->
<div id="loading-screen">
  <div class="loader-container">
    <div style="position: relative;">
      <div class="tooth-icon"></div>
      <div class="sparkle sparkle-1"></div>
      <div class="sparkle sparkle-2"></div>
      <div class="sparkle sparkle-3"></div>
    </div>

    <div class="loading-text">Dental Care</div>

    <div class="progress-bar">
      <div class="progress-fill"></div>
    </div>

    <div class="dots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>
</div>

<script>
  // Hide loading screen when Flutter app is ready
  window.addEventListener('flutter-first-frame', function() {
    const loadingScreen = document.getElementById('loading-screen');
    loadingScreen.classList.add('fade-out');
    setTimeout(() => {
      loadingScreen.style.display = 'none';
    }, 500);
  });

  // Fallback: Hide after 10 seconds if flutter-first-frame doesn't fire
  setTimeout(() => {
    const loadingScreen = document.getElementById('loading-screen');
    if (loadingScreen && loadingScreen.style.display !== 'none') {
      loadingScreen.classList.add('fade-out');
      setTimeout(() => {
        loadingScreen.style.display = 'none';
      }, 500);
    }
  }, 10000);
</script>

<script src="flutter_bootstrap.js" async></script>
</body>
</html>
